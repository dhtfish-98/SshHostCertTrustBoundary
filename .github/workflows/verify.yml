name: Verify SSH host certificate trust boundary

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.2"
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python3 scripts/run_validation.py --build-root Build/validation
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ssh-host-cert-${{ matrix.os }}
          path: |
            Build/validation/validation.json
            Build/validation/*.log
            Build/validation/*-audit.jsonl
          if-no-files-found: error
